<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoltraak — Motion Showcase</title>
<style>
/*__FONTS__*/
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-cam:cubic-bezier(.65,0,.35,1);--sans:"Archivo Variable","Archivo",ui-sans-serif,system-ui,sans-serif;--mono:"Martian Mono Variable","Martian Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050706;color:#e9ede7;font-family:var(--sans)}
*{-webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;user-select:none}
#wrap{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.7);outline:1px solid #1b211d}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:linear-gradient(#0c0f0d,#080b09);color:#e9ede7}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at 50% 55%,#000 30%,transparent 80%)}
#stage.paused *{animation-play-state:paused!important}

/* caption */
#cap{position:absolute;left:100px;top:26px;width:1400px;height:100px}
.cap{position:absolute;inset:0}
.cap .kick{font:600 12px/1 var(--sans);font-stretch:78%;letter-spacing:.24em;color:#b09a63;opacity:0;transform:translateY(6px);transition:all .7s var(--ease-out)}
.cap h2{margin:12px 0 0;font:600 40px/1.05 var(--sans);font-stretch:84%;letter-spacing:-.012em;display:inline}
.cap .wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-right:.26em}
.cap .wd>span{display:inline-block;transform:translateY(112%);transition:transform .9s var(--ease-out)}
.cap .row{display:block;margin-top:12px}
.cap .sub{margin:10px 0 0;font-size:15px;color:#a6aea4;opacity:0;transform:translateY(8px);transition:all .8s var(--ease-out) .35s}
.cap.in .kick,.cap.in .sub{opacity:1;transform:none}.cap.in .wd>span{transform:none}
.cap.out{opacity:0;transform:translateY(-8px);transition:all .35s ease-in}

/* window */
#win{position:absolute;left:100px;top:134px;width:1400px;height:744px;border:1px solid #3a423c;border-radius:6px;background:#0b0e0d;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.6),0 30px 70px -10px rgba(0,0,0,.85);
  transition:transform 1.1s var(--ease-out),opacity .9s var(--ease-out),filter 1s var(--ease-out)}
#win.off{opacity:0;transform:translateY(60px) scale(.96);filter:blur(6px)}
#win.gone{opacity:0;transform:translateY(-24px) scale(.92);filter:blur(10px);transition-duration:1s}
#tb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;background:#0f1311;border-bottom:1px solid #232a25;font:600 11px var(--sans);color:#868e84}
#tb .wc{display:flex;height:100%}#tb .wc i{width:46px;display:grid;place-items:center;font-style:normal;color:#868e84}
#tb .wc i svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1}
#clip{position:absolute;left:0;top:28px;width:1400px;height:716px;overflow:hidden}
#box{position:absolute;left:0;top:0;width:1400px;height:716px;transform-origin:0 0;transition:transform 1.5s var(--ease-cam)}
#app,#web{pointer-events:none;-webkit-user-select:none;user-select:none}
::selection{background:transparent}
#app{display:block;width:1400px;height:716px;border:0;background:#161a17}

/* browser overlay (a neutral browser frame around the extension's real content script) */
#browser{position:absolute;left:0;top:0;width:1400px;height:716px;z-index:30;background:#202124;transform:translateY(104%);transition:transform 1.1s var(--ease-cam);display:flex;flex-direction:column}
#browser.up{transform:none}
.bchrome{flex:none;background:#202124;border-bottom:1px solid #35363a}
.btabs{height:36px;display:flex;align-items:flex-end;padding:0 12px;gap:4px}
.btab{height:30px;padding:0 16px;background:#35363a;border-radius:8px 8px 0 0;font:12px system-ui,sans-serif;color:#e8eaed;display:flex;align-items:center;gap:8px;max-width:260px}
.btab i{width:12px;height:12px;border-radius:3px;background:#e5533a;flex:none}
.baddr{display:flex;align-items:center;gap:12px;padding:6px 12px 8px;background:#35363a;font:13px system-ui,sans-serif;color:#e8eaed}
.baddr .url{flex:1;background:#202124;border-radius:16px;padding:6px 14px;color:#bdc1c6}
.baddr .ext{width:24px;height:24px;border-radius:5px;background:#1e2320;border:1px solid #4c564e;display:grid;place-items:center;font:700 11px system-ui;color:#35c46f}
#web{display:block;width:1400px;height:636px;border:0;background:#0f1115}
/* cursor */
#cursor{position:absolute;left:0;top:0;z-index:60;pointer-events:none;opacity:0;margin:-2px 0 0 -3px;transition:transform 1s cubic-bezier(.45,.05,.2,1),opacity .4s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
#cursor.show{opacity:1}#cursor svg{display:block;transition:transform .12s}#cursor.press svg{transform:scale(.82)}
.rip{position:absolute;z-index:59;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;animation:rip .7s var(--ease-out) forwards}
@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(3.4);opacity:0}}

/* title / end */
.over{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.over .lampsrow{display:flex;gap:12px;margin-bottom:38px}
.over .lampsrow i{width:14px;height:14px;border-radius:50%;background:#2b332d;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.over .lampsrow i.on{background:var(--c)}
.wm{font:700 104px/1 var(--sans);font-stretch:78%;letter-spacing:.6em;margin-right:-.6em;opacity:0;filter:blur(12px);transition:letter-spacing 2.4s var(--ease-out),opacity 1.2s ease,filter 1.4s var(--ease-out)}
.over.in .wm{letter-spacing:.24em;margin-right:-.24em;opacity:1;filter:none}
.tg{margin-top:26px;font-size:22px;color:#a6aea4;font-stretch:90%;opacity:0;transform:translateY(10px);transition:all 1s var(--ease-out)}
.over.tag2 .tg{opacity:1;transform:none}
.over.leave{opacity:0;transform:scale(1.08);filter:blur(10px);transition:all 1s var(--ease-cam)}
.feat{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin-top:38px}
.feat span{padding:9px 16px;border:1px solid #333b35;background:#161a17;color:#a6aea4;font:600 12px/1 var(--sans);font-stretch:78%;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(12px);transition:all .7s var(--ease-out) calc(var(--i)*90ms)}
.over.tag2 .feat span{opacity:1;transform:none}

/* controls */
body.rec #ctl{display:none}
#ctl{display:flex;align-items:center;gap:10px}
.cb{width:34px;height:34px;display:grid;place-items:center;background:#161a17;border:1px solid #333b35;border-radius:3px;color:#e9ede7;cursor:pointer;font:600 12px var(--sans)}
.cb:hover{border-color:#56a2f0}
.chips{display:flex;gap:6px}
.chip{position:relative;height:34px;padding:0 12px;background:#101312;border:1px solid #232a25;border-radius:3px;color:#868e84;font:600 10px/1 var(--sans);font-stretch:78%;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;overflow:hidden;display:flex;align-items:center;gap:7px}
.chip span{color:#4c564e}.chip:hover{color:#e9ede7}
.chip i{position:absolute;left:0;bottom:0;height:2px;width:calc(var(--p,0)*100%);background:#b09a63}
.chip.on{color:#e9ede7;border-color:#4c564e}.chip.on span{color:#b09a63}
.chip.done i{width:100%;background:#4c564e}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <div id="cap"></div>
  <div id="win" class="off">
    <div id="tb"><span>Zoltraak</span><div class="wc"><i><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></i><i><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></i><i><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></i></div></div>
    <div id="clip"><div id="box"><iframe id="app" title="Zoltraak"></iframe></div>
      <div id="browser"><div class="bchrome"><div class="btabs"><div class="btab"><i></i>Keynote 2026 — Full Session</div></div><div class="baddr"><div class="url">video.example.com/watch/4kz8</div><div class="ext">Z</div></div></div><iframe id="web" title="Web page"></iframe></div></div>
  </div>
  <div class="over" id="title">
    <div class="lampsrow"><i style="--c:#56a2f0"></i><i style="--c:#35c46f"></i><i style="--c:#e8a317"></i><i style="--c:#ea6c24"></i><i style="--c:#f1595e"></i></div>
    <div class="wm">ZOLTRAAK</div>
    <div class="tg">Every download, on the board.</div>
  </div>
  <div class="over" id="end" style="visibility:hidden">
    <div class="lampsrow"><i style="--c:#56a2f0"></i><i style="--c:#35c46f"></i><i style="--c:#e8a317"></i><i style="--c:#ea6c24"></i><i style="--c:#f1595e"></i></div>
    <div class="wm">ZOLTRAAK</div>
    <div class="tg">A download manager that shows its work.</div>
    <div class="feat"><span style="--i:0">Segmented</span><span style="--i:1">Resumable</span><span style="--i:2">Video</span><span style="--i:3">Music</span><span style="--i:4">Browser extension</span><span style="--i:5">Scheduler</span><span style="--i:6">Discord delivery</span><span style="--i:7">Day &amp; night</span></div>
  </div>
  <div id="cursor"><svg width="24" height="24" viewBox="0 0 22 22"><path d="M3 2l13 7.5-5.6 1.6L8.2 17z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
 </div>
</div>
<div id="ctl">
  <button class="cb" id="bPlay" title="Pause / play (space)">❚❚</button>
  <button class="cb" id="bRe" title="Restart (R)">↻</button>
  <div class="chips" id="chips"></div>
</div>

<script>
const APP_HTML = /*__APP_HTML__*/"";
const WEB_HTML = /*__WEB_HTML__*/"";
</script>
<script>
/* =========================================================================
   Director. The product on screen is the real Zoltraak UI running in an
   iframe on a scripted mock engine; this file only drives it like a user
   would — moving a cursor, clicking real buttons, typing into real inputs.
   ========================================================================= */
const CANCEL=Symbol('cancel');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const $=(s,r=document)=>r.querySelector(s);
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const wrap=$('#wrap'),stage=$('#stage'),win=$('#win'),box=$('#box'),F=$('#app'),cursor=$('#cursor');
let k=1,tok=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,curS=null,idx=0;

const REC=location.search.indexOf('record')>-1;if(REC){document.body.classList.add('rec');document.body.style.gap='0';}
function fit(){const w=REC?innerWidth:Math.max(320,Math.min(innerWidth-32,(innerHeight-92)*16/9));wrap.style.width=w+'px';wrap.style.height=(w*9/16)+'px';k=w/1600;stage.style.transform=`scale(${k})`;}
addEventListener('resize',fit);fit();

/* ---------- clock ---------- */
let last=performance.now();
setInterval(()=>{
  const n=performance.now(),dt=Math.min(60,n-last);last=n;
  if(paused||!curS)return;
  curS.t+=dt;chips[curS.idx].style.setProperty('--p',Math.min(1,curS.t/scenes[curS.idx].dur));
  try{FW()?.__mock?.step(dt);}catch{}
},16);
function mkS(cur,i){const S={t:0,idx:i};
  S.at=async t=>{while(S.t<t){if(cur!==tok)throw CANCEL;await sleep(16);}if(cur!==tok)throw CANCEL;};
  S.w=ms=>S.at(S.t+ms);return S;}

/* ---------- the app ---------- */
const FW=()=>F.contentWindow, FD=()=>F.contentDocument;
function loadApp(){return new Promise(res=>{
  F.onload=async()=>{for(let i=0;i<200&&!(FD()?.querySelector('header')&&FD().querySelector('main'));i++)await sleep(50);await sleep(250);lock(FD());res();};
  F.srcdoc=APP_HTML;
});}
/* The staged screens are display-only: nothing inside them can be selected, focused by the viewer or highlighted. */
const LOCK='*{-webkit-user-select:none!important;user-select:none!important;-webkit-user-drag:none!important}::selection{background:transparent!important}html,body{pointer-events:none}';
function lock(doc){try{const st=doc.createElement('style');st.textContent=LOCK;doc.head.appendChild(st);doc.addEventListener('selectstart',e=>e.preventDefault(),true);doc.addEventListener('dragstart',e=>e.preventDefault(),true);}catch{}}
const vis=e=>e&&e.getClientRects().length>0;
const all=(sel)=>[...FD().querySelectorAll(sel)].filter(vis);
const one=(sel,re)=>all(sel).find(e=>!re||re.test(((e.getAttribute('aria-label')||'')+' '+e.textContent).trim()));
const mock=()=>FW().__mock;
function setValue(input,v){
  const proto=input instanceof FW().HTMLTextAreaElement?FW().HTMLTextAreaElement.prototype:FW().HTMLInputElement.prototype;
  Object.getOwnPropertyDescriptor(proto,'value').set.call(input,v);input.dispatchEvent(new (FW().Event)('input',{bubbles:true}));
}
async function typeInto(S,input,text,ms){input.focus();const t0=S.t;for(let i=1;i<=text.length;i++){await S.at(t0+ms*i/text.length);setValue(input,text.slice(0,i));}}
async function waitFor(S,fn,max=4000){const t0=S.t;while(S.t-t0<max){const v=fn();if(v)return v;await S.w(60);}return null;}

const W=$('#web'),WD=()=>W.contentDocument;
function loadWeb(){return new Promise(res=>{W.onload=()=>{lock(WD());res();};W.srcdoc=WEB_HTML;});}
const sessionItems=()=>{const m=mock().state;return [...m.queue.map(r=>({...r,kind:'download'})),...m.video.map(j=>({id:j.id,kind:'video',filename:j.title,url:j.webpageUrl,state:j.state==='merging'?'downloading':j.state,downloadedBytes:j.downloadedBytes,totalBytes:j.totalBytes,bytesPerSecond:j.bytesPerSecond,connections:1,directory:'D:\Video',path:j.path}))];};
/* the extension's background worker, as far as the content script can tell */
window.__ext=async m=>{
  switch(m.type){
    case 'zoltraak-health':return{ok:true,up:true,licensed:true};
    case 'zoltraak-tab-media':return{ok:true,media:[]};
    case 'zoltraak-analyze-best':await sleep(1300);return{ok:true,metadata:mock().KEYNOTE};
    case 'zoltraak-download':await sleep(500);await mock().hooks.start_video_download({title:m.title,webpageUrl:m.webpageUrl,format:m.format});return{ok:true};
    case 'zoltraak-get-session':return{ok:true,paired:true,items:sessionItems()};
    default:return{ok:true};
  }
};
/* geometry: iframe px -> stage px (accounts for camera + page scale) */
function pt(e,fx=.5,fy=.5){const r=e.getBoundingClientRect(),f=F.getBoundingClientRect(),s=wrap.getBoundingClientRect(),z=f.width/1400;return[(f.left-s.left+(r.left+r.width*fx)*z)/k,(f.top-s.top+(r.top+r.height*fy)*z)/k];}
let cpos=[1560,860];
function curTo(e,fx=.5,fy=.5,ms){const[x,y]=pt(e,fx,fy);cpos=[x,y];cursor.classList.add('show');cursor.style.transitionDuration=ms?ms+'ms,.4s':'';cursor.style.transform=`translate(${x}px,${y}px)`;}
async function click(S,e){
  cursor.classList.add('press');const r=h('<i class="rip"></i>');r.style.left=cpos[0]+'px';r.style.top=cpos[1]+'px';stage.appendChild(r);setTimeout(()=>r.remove(),800);
  await S.w(110);if(e){e.focus?.({preventScroll:true});e.click();}await S.w(70);cursor.classList.remove('press');
}
function camTo(cx,cy,s=1){const W=1400,H=716;let tx=W/2-cx*s,ty=H/2-cy*s;tx=Math.min(0,Math.max(W-W*s,tx));ty=Math.min(0,Math.max(H-H*s,ty));box.style.transform=s===1&&!tx&&!ty?'none':`translate(${tx}px,${ty}px) scale(${s})`;}
function camEl(e,s=1.6,fx=.5,fy=.5){const r=e.getBoundingClientRect();camTo(r.left+r.width*fx,r.top+r.height*fy,s);}
function scrollInApp(el,top){el.scrollTo({top,behavior:'smooth'});}
const nav=name=>one('header button',new RegExp('^'+name+'\\b'));

/* ---------- caption ---------- */
let capEl=null;
function caption(kick,head,sub){
  if(capEl){const o=capEl;o.classList.add('out');setTimeout(()=>o.remove(),400);capEl=null;}
  if(!head)return;
  const c=h(`<div class="cap"><div class="kick">${kick}</div><span class="row"><h2>${head.split(' ').map((w,i)=>`<span class="wd"><span style="transition-delay:${120+i*70}ms">${w}</span></span>`).join('')}</h2></span><p class="sub">${sub}</p></div>`);
  $('#cap').appendChild(c);capEl=c;setTimeout(()=>c.classList.add("in"),40);
}

/* ---------- seeds ---------- */
const MB=1024*1024,GB=1024*MB;
function seedBoard(){
  const m=mock(),a=(n,u,tot,pct,sp,st,conn)=>m.addDownload({filename:n,url:u,totalBytes:tot,downloadedBytes:tot*pct,state:st,connections:conn},{speed:sp});
  a('field-recordings-2026.tar','https://cdn.example.com/archive/field-recordings-2026.tar',3.3*GB,0,16*MB,'waiting',8);
  a('dataset-images-part2.zip','https://data.example.net/dataset-images-part2.zip',12.4*GB,.45,0,'paused',16);
  a('Q3-board-pack.pdf','https://files.example.com/Q3-board-pack.pdf',84*MB,.78,3*MB,'downloading',8);
  a('Keynote-2026-Full-Session.mp4','https://video.example.com/media/Keynote-2026-Full-Session.mp4',2.1*GB,.12,24*MB,'downloading',16);
  a('ubuntu-26.04-desktop-amd64.iso','https://releases.example.org/ubuntu-26.04-desktop-amd64.iso',5.9*GB,.3,36*MB,'downloading',16);
}

/* =========================================================================
   Scenes
   ========================================================================= */
async function sIntro(S){
  const t=$('#title');
  await S.at(300);t.classList.add('in');
  [...t.querySelectorAll('.lampsrow i')].forEach((l,i)=>setTimeout(()=>l.classList.add('on'),400+i*260));
  await S.at(2200);t.classList.add('tag2');
  await S.at(4300);t.classList.add('leave');win.classList.remove('off');
}
async function sBoard(S){
  caption('01 — THE LINE','Every transfer, at a glance.','Segmented downloads drawn as real byte ranges — no fake progress bars.');
  await S.at(2600);
  const line=one('main section, main [class*="line"]')||FD().querySelector('main');
  camTo(640,92,1.5);
  await S.at(7200);camTo(700,358,1);
}
async function sAdd(S){
  caption('02 — ADD','Paste a link. It routes itself.','Drop in one link or many — rules sort each file into the right folder.');
  await S.at(900);
  const inp=await waitFor(S,()=>one('textarea[placeholder^="https"]'));
  curTo(inp,.3,.5);
  await S.at(1900);await click(S,inp);
  await typeInto(S,inp,'https://files.example.com/notes/field-notes-vol3.pdf',1500);
  await S.at(4000);const btn=one('button',/^Add download/i);curTo(btn);
  await S.at(5000);await click(S,btn);
  await S.at(5600);cursor.classList.remove('show');camTo(700,100,1.5);
  await S.at(8000);camTo(700,358,1);
}
const scrollerOf=e=>{for(let p=e.parentElement;p;p=p.parentElement){const o=FW().getComputedStyle(p).overflowY;if((o==='auto'||o==='scroll')&&p.scrollHeight>p.clientHeight)return p;}return null;};
function bringIntoView(e){const sc=scrollerOf(e);if(!sc)return;const r=e.getBoundingClientRect(),c=sc.getBoundingClientRect();sc.scrollTo({top:sc.scrollTop+(r.top-c.top)-c.height/2+r.height/2,behavior:'smooth'});}
async function goTo(S,name){const b=nav(name);curTo(b);await S.w(1000);await click(S,b);await S.w(700);}

async function sVideo(S){
  caption('03 — VIDEO','Pick a quality. Skip the toolchain.','Paste a page or a stream link — direct files, HLS and DASH, with audio merged for you.');
  await S.at(700);await goTo(S,'Video');
  const inp=await waitFor(S,()=>one('input[aria-label="Video page or media URL"]'));
  curTo(inp,.3,.5);await S.at(3100);await click(S,inp);
  await typeInto(S,inp,'https://video.example.com/watch/4kz8',1300);
  await S.at(4900);const an=one('button',/^Analyze/i);curTo(an);
  await S.at(5700);await click(S,an);
  const dl=await waitFor(S,()=>all('button').find(b=>/^download$/i.test(b.textContent.trim())),5000);
  await S.at(7600);
  const rowBtn=all('button').filter(b=>/^download$/i.test(b.textContent.trim())).find(b=>{let p=b;for(let i=0;i<4&&p;i++,p=p.parentElement)if(p&&/1080p/.test(p.textContent)&&!/2160p/.test(p.textContent))return true;return false;})||dl;
  bringIntoView(rowBtn);
  await S.at(8900);curTo(rowBtn);
  await S.at(9900);await click(S,rowBtn);
  await S.at(10600);cursor.classList.remove('show');
}
async function sMusic(S){
  caption('04 — MUSIC','Playlists in, tagged files out.','Spotify, Apple Music, Deezer, YouTube, SoundCloud, Bandcamp — one link, every track.');
  await S.at(700);await goTo(S,'Music');
  const ta=await waitFor(S,()=>one('textarea[aria-label="Music link or search"]'));
  curTo(ta,.3,.5);await S.at(3000);await click(S,ta);
  await typeInto(S,ta,'https://music.example.com/playlist/late-night-drive',1300);
  await S.at(4800);const lk=one('button',/^look up/i);curTo(lk);
  await S.at(5600);await click(S,lk);
  await waitFor(S,()=>one('button',/download all/i),5000);
  await S.at(7600);
  const sel=one('select[aria-label="Audio format"]');
  if(sel){curTo(sel);await S.at(8600);await click(S);const o=[...sel.options].find(x=>/FLAC/i.test(x.text));if(o){const setter=Object.getOwnPropertyDescriptor(FW().HTMLSelectElement.prototype,'value').set;setter.call(sel,o.value);sel.dispatchEvent(new (FW().Event)('change',{bubbles:true}));}}
  await S.at(9500);const da=one('button',/download all/i);curTo(da);
  await S.at(10400);await click(S,da);
  await S.at(11200);cursor.classList.remove('show');
  const sc=scrollerOf(da);if(sc)sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});
}
async function sBrowser(S){
  caption('05 — BROWSER','One click, from any page.','The extension finds the video on the page and hands it to the app — nothing to copy or paste.');
  await loadWeb();
  await S.at(600);$('#browser').classList.add('up');
  const host=await waitFor(S,()=>WD().getElementById('zoltraak-extension-host'),6000);
  await S.at(2600);
  const sr=host&&host.shadowRoot;
  const main=sr&&(sr.querySelector('button')||sr.querySelector('[role=button]'));
  if(main){curTo(main,.5,.5,1300);await S.at(4000);await click(S,main);}
  const dl=await waitFor(S,()=>{const b=[...(sr?sr.querySelectorAll('.dl-btn'):[])];return b.find(x=>/1080p/.test(x.closest('.row,[class*=row]')?.textContent||''))||b[2]||b[0];},7000);
  await S.at(7200);
  if(dl){curTo(dl,.5,.5,1000);await S.at(8300);await click(S,dl);}
  await S.at(9800);cursor.classList.remove('show');
  await S.at(11000);$('#browser').classList.remove('up');
  const b=nav('Downloads');if(b)b.click();
}
async function sTimetable(S){
  caption('06 — TIMETABLE','Run while you sleep.','Set a daily window and what happens when the queue drains.');
  await S.at(700);await goTo(S,'Settings');
  const tab=await waitFor(S,()=>one('[role=tab]',/Timetable/));
  curTo(tab);await S.at(2800);await click(S,tab);
  const sw=await waitFor(S,()=>one('[role=switch]',/Time window/i));
  await S.at(4300);curTo(sw);
  await S.at(5300);await click(S,sw);
  await S.at(6600);const sel=one('select[aria-label="When the queue finishes"]');
  if(sel){curTo(sel,.5,.5);await S.at(7600);await click(S);const setter=Object.getOwnPropertyDescriptor(FW().HTMLSelectElement.prototype,'value').set;setter.call(sel,'open_folder');sel.dispatchEvent(new (FW().Event)('change',{bubbles:true}));}
  await S.at(9300);cursor.classList.remove('show');
}
async function sThemes(S){
  caption('07 — DAY & NIGHT','Day shift. Night shift.','Two hand-set palettes for one panel — the enamel changes, the signal lamps do not.');
  await S.at(700);await goTo(S,'Settings');
  const tab=await waitFor(S,()=>one('[role=tab]',/Appearance/));
  curTo(tab);await S.at(2800);await click(S,tab);
  const light=await waitFor(S,()=>one('button',/Lighting Mode/));
  await S.at(4200);curTo(light);await S.at(5000);await click(S,light);
  const day=await waitFor(S,()=>one('[role=radio]',/Day Enamel/));
  await S.at(6600);curTo(day);await S.at(7600);await click(S,day);
  await S.at(10500);cursor.classList.remove('show');
}
async function sOutro(S){
  caption();win.classList.add('gone');
  const e=$('#end');e.style.visibility='visible';e.className='over';
  await S.at(900);e.classList.add('in');
  [...e.querySelectorAll('.lampsrow i')].forEach((l,i)=>setTimeout(()=>l.classList.add('on'),i*220));
  await S.at(3000);e.classList.add('tag2');
}

const scenes=[
 {label:'Open',dur:6500,run:sIntro},{label:'Line',dur:10500,run:sBoard},{label:'Add',dur:9500,run:sAdd},
 {label:'Video',dur:15000,run:sVideo},{label:'Music',dur:16000,run:sMusic},{label:'Browser',dur:14000,run:sBrowser},{label:'Timetable',dur:11000,run:sTimetable},
 {label:'Themes',dur:12500,run:sThemes},{label:'Close',dur:8000,run:sOutro},
];
const chips=scenes.map((s,i)=>{const b=h(`<button class="chip"><span>${String(i+1).padStart(2,'0')}</span>${s.label}<i></i></button>`);b.onclick=()=>go(i);$('#chips').appendChild(b);return b;});

function resetStage(i){
  $('#browser').classList.remove('up');box.style.transform='none';cursor.classList.remove('show','press');cursor.style.transitionDuration='0ms,0ms';cursor.style.transform='translate(1560px,860px)';cpos=[1560,860];
  setTimeout(()=>cursor.style.transitionDuration='',60);
  [...stage.querySelectorAll('.rip')].forEach(r=>r.remove());caption();
  const t=$('#title'),e=$('#end');t.className='over';e.className='over';e.style.visibility='hidden';
  [...document.querySelectorAll('.lampsrow i')].forEach(l=>l.classList.remove('on'));
  win.className=i===0?'off':'';t.style.visibility=i===0?'':'hidden';
}
async function go(i){
  const cur=++tok;
  try{
    resetStage(i);curS=null;
    await loadApp();if(cur!==tok)return;seedBoard();
    for(let n=i;n<scenes.length;n++){
      idx=n;const S=mkS(cur,n);curS=S;
      chips.forEach((c,j)=>{c.classList.toggle('on',j===n);c.classList.toggle('done',j<n);if(j>n)c.style.setProperty('--p',0);});
      if(n===0)$('#title').style.visibility='';
      await scenes[n].run(S);await S.at(scenes[n].dur);
    }
    await sleep(600);if(REC){window.__done=true;return;}if(cur===tok)go(0);
  }catch(e){if(e!==CANCEL)throw e;}
}

/* ---------- controls ---------- */
const bPlay=$('#bPlay');
function setPaused(p){paused=p;stage.classList.toggle('paused',p);bPlay.textContent=p?'▶':'❚❚';
  try{FD().getAnimations().forEach(a=>p?a.pause():a.play());}catch{}
  try{FW().__mock.state.paused=p;}catch{}}
bPlay.onclick=()=>setPaused(!paused);$('#bRe').onclick=()=>go(0);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();setPaused(!paused);}
  else if(e.key==='ArrowRight')go(Math.min(scenes.length-1,idx+1));
  else if(e.key==='ArrowLeft')go(Math.max(0,idx-1));
  else if(e.key==='r'||e.key==='R')go(0);
});
setPaused(paused);window.go=go;
(document.fonts?.ready||Promise.resolve()).then(()=>go(0));
</script>
